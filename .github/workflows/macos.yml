name: macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (arm64)
    # macos-latest, not a pinned image: GitHub retired every macOS 14 image on
    # 2026-11-02, and a pinned label then cancels the job at 0s ("The
    # configuration 'macos-14-arm64-us-default' is not supported") before any
    # compiler runs.
    runs-on: macos-latest

    steps:
      - name: Checkout portty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout coffer (dependency)
        uses: actions/checkout@v7
        with:
          repository: chestso/coffer
          ref: v0.17.0
          path: coffer
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew untap aws/tap
          brew install autoconf automake libtool pkg-config \
            freetype harfbuzz libpng zip librsvg sdl3 thorvg

      - name: Build & install coffer
        working-directory: coffer
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$(brew --prefix)" --enable-release
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build portty
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-release
          make -j"$(sysctl -n hw.ncpu)"

      - name: Run tests
        run: make -C build check

      # The automake harness keeps the failing test's output in its own log
      # file, so a red "make check" says nothing about what went wrong.
      - name: Show test logs
        if: failure()
        run: |
          cat build/tests/test-suite.log || true
          for f in build/tests/test_*.log; do
            echo "=== $f"
            cat "$f"
          done

      - name: Build portable ZIP
        run: make -C build dist-portable

      - name: Verify extracted portable ZIP
        run: |
          package_dir=$(mktemp -d "$RUNNER_TEMP/portty-package.XXXXXX")
          archives=(portty-*-macos-*-sdl3.zip)
          test "${#archives[@]}" -eq 1
          ditto -x -k "${archives[0]}" "$package_dir"
          apps=("$package_dir"/*/Portty.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          for binary in "$app/Contents/MacOS/portty.real" "$app/Contents/Frameworks/"*; do
            codesign --verify --strict "$binary"
          done
          # The launcher advertises the bundled terminfo through TERMINFO_DIRS, so
          # a bundle that lost it is incomplete even though it still launches.
          # tic names the leaf directory after the ncurses build (a wide build
          # hex-encodes it), so locate the entry rather than assume a path.
          terminfo_dir="$app/Contents/Resources/share/terminfo"
          entry=$(find "$terminfo_dir" -type f -name portty-256color -print -quit)
          if [ -z "$entry" ]; then
            echo "ERROR: the bundle carries no portty-256color entry; it contains:" >&2
            find "$terminfo_dir" -print >&2
            exit 1
          fi
          TERMINFO_DIRS="$terminfo_dir" infocmp portty-256color >/dev/null
          "$app/Contents/MacOS/portty" --version
          echo "PORTTY_PACKAGED_EXE=$app/Contents/MacOS/portty" >> "$GITHUB_ENV"

      - name: Packaged GUI smoke test
        run: |
          cat > /tmp/gui-smoke.script <<'EOF'
          wait 1.5
          screendump /tmp/portty-gui-smoke.png
          wait 0.5
          quit
          EOF
          "$PORTTY_PACKAGED_EXE" -v -g 80x24 -d "Hello macOS" -S /tmp/gui-smoke.script
          test -s /tmp/portty-gui-smoke.png
          file /tmp/portty-gui-smoke.png

      - name: Upload GUI screenshot
        uses: actions/upload-artifact@v7
        with:
          name: portty-macos-gui-screenshot
          path: /tmp/portty-gui-smoke.png
          if-no-files-found: error
          retention-days: 14

      - name: Script exit status
        run: |
          cat > /tmp/pass.script <<'EOF'
          assert-contains "Hello macOS"
          quit
          EOF
          cat > /tmp/fail.script <<'EOF'
          assert-contains "definitely-not-there"
          EOF
          "$PORTTY_PACKAGED_EXE" -g 80x24 -d "Hello macOS" -S /tmp/pass.script
          if "$PORTTY_PACKAGED_EXE" -g 80x24 -d "Hello macOS" -S /tmp/fail.script; then
            echo "ERROR: a failed script exited 0" >&2
            exit 1
          fi
          if "$PORTTY_PACKAGED_EXE" -g 80x24 -d "Hello macOS" -S /tmp/no-such.script; then
            echo "ERROR: a missing script exited 0" >&2
            exit 1
          fi

      - name: Script observes the child exit
        run: |
          # `-e` turns a nonzero portty exit into a silent step abort, and a
          # step that dies without a word says nothing about why. Trace the
          # script's commands, print a boundary around each app run, and dump
          # the app's log when anything fails.
          set -x
          trap 'rc=$?; echo "STEP END rc=$rc" >&2' EXIT
          cat > /tmp/await.script <<'EOF'
          wait 1.0
          sendln exit 7
          await-exit 5
          assert-exit 7
          dumpstate /tmp/portty-await-exit.json
          quit
          EOF
          # `-e` would abort the step on portty's nonzero exit before the log
          # is printed, which is exactly the failure worth reading: capture the
          # status and dump the log instead.
          for i in $(seq 1 10); do
            rm -f /tmp/portty-await-exit.json
            rc=0
            echo "RUN $i START" >&2
            "$PORTTY_PACKAGED_EXE" -g 80x24 -v -S /tmp/await.script \
              >/tmp/portty-await-exit.log 2>&1 || rc=$?
            echo "RUN $i END rc=$rc" >&2
            if [ "$rc" -ne 0 ]; then
              echo "ERROR: portty exited $rc (run $i)" >&2
              cat /tmp/portty-await-exit.log >&2
              exit 1
            fi
            grep -q "await-exit: child exited with 7" /tmp/portty-await-exit.log ||
              { echo "ERROR: await-exit did not see the child exit (run $i)" >&2; cat /tmp/portty-await-exit.log >&2; exit 1; }
            grep -q "OK: child exit status 7" /tmp/portty-await-exit.log ||
              { echo "ERROR: assert-exit did not run (run $i)" >&2; cat /tmp/portty-await-exit.log >&2; exit 1; }
            test -s /tmp/portty-await-exit.json ||
              { echo "ERROR: the script stopped before the dump (run $i)" >&2; exit 1; }
          done

          # The same, with a selection pause holding the PTY reader: the
          # SIGCHLD pipe is still watched, so await-exit must resolve.
          cat > /tmp/pause.script <<'EOF'
          wait 1.0
          mousemove 20 40
          mousedown 20 40
          sendln exit 7
          mousemove 200 60
          await-exit 5
          assert-exit 7
          mouseup 200 60
          quit
          EOF
          for i in $(seq 1 5); do
            rc=0
            echo "PAUSE RUN $i START" >&2
            "$PORTTY_PACKAGED_EXE" -g 80x24 -v -S /tmp/pause.script \
              >/tmp/portty-await-pause.log 2>&1 &
            app=$!
            # While the app is awaiting the child, show what the child is
            # doing: a shell that never exits is either blocked on its own
            # write or stopped by the tty (T), and the two need different
            # fixes.
            sleep 3
            child=$(sed -n 's/.*child_pid=\([0-9][0-9]*\).*/\1/p' /tmp/portty-await-pause.log | head -1)
            if [ -n "$child" ]; then
              ps -o pid,ppid,pgid,tpgid,stat,wchan,command -p "$child" ||
                echo "child $child has already gone" >&2
              echo "---- threads" >&2
              ps -M -p "$child" 2>&1 | head -20 || true
              echo "---- fds" >&2
              lsof -p "$child" 2>&1 | head -20 || true
              echo "---- sample" >&2
              sample "$child" 1 -file /tmp/portty-child-sample.txt 2>&1 | tail -5 || true
              sed -n '1,60p' /tmp/portty-child-sample.txt 2>/dev/null ||
                echo "no sample file" >&2
            else
              echo "no child pid in the log yet" >&2
            fi
            wait "$app" || rc=$?
            echo "PAUSE RUN $i END rc=$rc" >&2
            if [ "$rc" -ne 0 ]; then
              echo "ERROR: portty exited $rc while paused (run $i)" >&2
              cat /tmp/portty-await-pause.log >&2
              echo "---- last unpaused run (loop 1, iteration 10):" >&2
              tail -25 /tmp/portty-await-exit.log >&2
              exit 1
            fi
            grep -q "OK: child exit status 7" /tmp/portty-await-pause.log ||
              { echo "ERROR: await-exit did not run while paused (run $i)" >&2; cat /tmp/portty-await-pause.log >&2; exit 1; }
          done

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: portty-macos-arm64-sdl3
          path: portty-*-macos-*-sdl3.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}
