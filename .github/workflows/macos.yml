name: macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (arm64)
    runs-on: macos-14

    steps:
      - name: Checkout portty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout coffer (dependency)
        uses: actions/checkout@v7
        with:
          repository: chestso/coffer
          ref: v0.2.1
          path: coffer
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew install autoconf automake libtool pkg-config \
            freetype harfbuzz libpng zip librsvg sdl3

      - name: Fetch QOI header
        run: sh scripts/fetch-qoi.sh

      - name: Build & install coffer
        working-directory: coffer
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$(brew --prefix)"
          make -j"$(sysctl -n hw.ncpu)"
          make check || true
          make install

      - name: Build portty
        run: |
          ./autogen.sh
          mkdir build && cd build
          CONFIGURE_ARGS=""
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            ../configure --enable-release $CONFIGURE_ARGS
          else
            ../configure $CONFIGURE_ARGS
          fi
          make -j"$(sysctl -n hw.ncpu)"

      - name: Run tests
        run: make -C build check

      - name: Build portable ZIP
        run: make -C build dist-portable

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: portty-macos-arm64-sdl3
          path: portty-*-macos-*-sdl3.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}
