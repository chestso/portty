name: macOS

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (arm64)
    runs-on: macos-14

    steps:
      - name: Checkout portty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout coffer (dependency)
        uses: actions/checkout@v7
        with:
          repository: chestso/coffer
          ref: v0.6.2
          path: coffer
          fetch-depth: 0

      - name: Install dependencies
        run: |
          brew untap aws/tap
          brew install autoconf automake libtool pkg-config \
            freetype harfbuzz libpng zip librsvg sdl3 thorvg

      - name: Fetch QOI header
        run: sh scripts/fetch-qoi.sh

      - name: Build & install coffer
        working-directory: coffer
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix="$(brew --prefix)" --enable-release
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Build portty
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --enable-release
          make -j"$(sysctl -n hw.ncpu)"

      - name: Run tests
        run: make -C build check

      - name: Build portable ZIP
        run: make -C build dist-portable

      - name: Verify extracted portable ZIP
        run: |
          package_dir=$(mktemp -d "$RUNNER_TEMP/portty-package.XXXXXX")
          archives=(portty-*-macos-*-sdl3.zip)
          test "${#archives[@]}" -eq 1
          ditto -x -k "${archives[0]}" "$package_dir"
          apps=("$package_dir"/*/Portty.app)
          test "${#apps[@]}" -eq 1
          app="${apps[0]}"
          for binary in "$app/Contents/MacOS/portty.real" "$app/Contents/Frameworks/"*; do
            codesign --verify --strict "$binary"
          done
          # The launcher advertises the bundled terminfo through TERMINFO_DIRS, so
          # a bundle that lost it is incomplete even though it still launches.
          terminfo_dir="$app/Contents/Resources/share/terminfo"
          find "$terminfo_dir" -print
          entry=$(find "$terminfo_dir" -type f -name portty-256color -print -quit)
          test -n "$entry"
          TERMINFO_DIRS="$terminfo_dir" infocmp portty-256color >/dev/null
          "$app/Contents/MacOS/portty" --version
          echo "PORTTY_PACKAGED_EXE=$app/Contents/MacOS/portty" >> "$GITHUB_ENV"

      - name: Packaged GUI smoke test
        run: |
          cat > /tmp/gui-smoke.script <<'EOF'
          wait 1.5
          screendump /tmp/portty-gui-smoke.png
          wait 0.5
          quit
          EOF
          "$PORTTY_PACKAGED_EXE" -v -g 80x24 -d "Hello macOS" -S /tmp/gui-smoke.script
          test -s /tmp/portty-gui-smoke.png
          file /tmp/portty-gui-smoke.png

      - name: Upload GUI screenshot
        uses: actions/upload-artifact@v7
        with:
          name: portty-macos-gui-screenshot
          path: /tmp/portty-gui-smoke.png
          if-no-files-found: error
          retention-days: 14

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: portty-macos-arm64-sdl3
          path: portty-*-macos-*-sdl3.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}
