name: Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout portty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout coffer (dependency)
        uses: actions/checkout@v7
        with:
          repository: chestso/coffer
          ref: v0.6.1
          path: coffer
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            autoconf
            automake
            libtool
            make
            pkg-config
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-thorvg
            ncurses
            zip
            p7zip

      - name: Fetch QOI header
        run: sh scripts/fetch-qoi.sh

      - name: Build & install coffer
        working-directory: coffer
        run: |
          ./autogen.sh
          mkdir build && cd build
          sh ../configure --prefix="$MINGW_PREFIX" --enable-release
          make -j"$(nproc)"
          make install

      - name: Build portty
        run: |
          ./autogen.sh
          mkdir build && cd build
          sh ../configure --enable-release
          make -j"$(nproc)"

      - name: Run tests
        run: make -C build check

      - name: GUI smoke test (selection drag)
        run: |
          mkdir -p build/smoke
          rm -f build/smoke/child_ran.txt build/smoke/selection.json
          cat > build/smoke/select.script <<'EOF'
          wait 2.0
          sendln echo SMOKE_MARKER_OK > build/smoke/child_ran.txt
          wait 2.5
          mousemove 20 40
          mousedown 20 40
          mousemove 200 40
          mousemove 200 60
          mouseup 200 60
          wait 0.3
          dumpstate build/smoke/selection.json
          quit
          EOF
          ./build/src/portty -S build/smoke/select.script
          # The child must have run, and the drag must have reached the dump:
          # pausing the PTY for a selection must not end the session.
          grep -q SMOKE_MARKER_OK build/smoke/child_ran.txt
          test -s build/smoke/selection.json
          grep -q '"selection": {' build/smoke/selection.json

      - name: Build portable ZIP
        run: make -C build dist-portable

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: portty-windows-x86_64-sdl3
          path: portty-*-windows-*-sdl3.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}
