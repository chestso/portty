name: Windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.backend }})
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    strategy:
      fail-fast: false
      matrix:
        backend: [sdl3, sokol]

    steps:
      - name: Checkout portty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout coffer (dependency)
        uses: actions/checkout@v7
        with:
          repository: chestso/coffer
          ref: v0.1.4
          path: coffer
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            autoconf
            automake
            libtool
            make
            pkg-config
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-thorvg
            ncurses
            zip
            p7zip

      - name: Install SDL3 (SDL3 backend only)
        if: matrix.backend == 'sdl3'
        run: pacman -S --noconfirm mingw-w64-ucrt-x86_64-sdl3

      - name: Fetch Sokol headers (Sokol backend only)
        if: matrix.backend == 'sokol'
        run: sh scripts/fetch-sokol.sh

      - name: Build & install coffer
        working-directory: coffer
        run: |
          ./autogen.sh
          mkdir build && cd build
          sh ../configure --prefix="$MINGW_PREFIX"
          make -j"$(nproc)"
          make check
          make install

      - name: Build portty
        run: |
          ./autogen.sh
          mkdir build && cd build
          CONFIGURE_ARGS=""
          if [ "${{ matrix.backend }}" = "sokol" ]; then
            CONFIGURE_ARGS="--with-backend=sokol"
          fi
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            sh ../configure --enable-release $CONFIGURE_ARGS
          else
            sh ../configure $CONFIGURE_ARGS
          fi
          make -j"$(nproc)"

      - name: Run tests
        run: make -C build check

      - name: Build portable ZIP
        run: make -C build dist-portable

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: portty-windows-x86_64-${{ matrix.backend }}
          path: portty-*-windows-*-${{ matrix.backend }}.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download SDL3 artifact
        uses: actions/download-artifact@v8
        with:
          name: portty-windows-x86_64-sdl3
          path: artifacts/sdl3

      - name: Download Sokol artifact
        uses: actions/download-artifact@v8
        with:
          name: portty-windows-x86_64-sokol
          path: artifacts/sokol

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/sdl3/portty-*-windows-*-sdl3.zip
            artifacts/sokol/portty-*-windows-*-sokol.zip
          generate_release_notes: false
          fail_on_unmatched_files: true
