name: Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    env:
      # Pinned coffer ref — single source for both the checkout and the
      # coffer-install cache key in this file. Bump alongside configure.ac's
      # pkg-config minimum; the same ref lives in linux.yml / macos.yml
      # (bump all three together).
      COFFER_REF: v0.7.0

    steps:
      - name: Checkout portty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout coffer (dependency)
        uses: actions/checkout@v7
        with:
          repository: chestso/coffer
          ref: ${{ env.COFFER_REF }}
          path: coffer
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            autoconf
            automake
            libtool
            make
            pkg-config
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-thorvg
            ncurses
            zip
            unzip
            p7zip

      - name: Resolve the coffer install prefix
        id: coffer-prefix
        run: |
          prefix="$(cygpath -m "$HOME/.local")"
          echo "coffer install prefix: $prefix"
          echo "path=$prefix" >> "$(cygpath -u "$GITHUB_OUTPUT")"

      - name: Cache coffer install
        id: coffer-cache
        uses: actions/cache@v5
        with:
          # The prefix ($HOME/.local inside the MSYS2 shell) in host form —
          # actions/cache runs on the host, not in the MSYS2 shell. Resolved
          # in the step above rather than spelled out, because the MSYS2 root
          # moves with setup-msys2's `release` input: the upstream release
          # extracts to $RUNNER_TEMP/msys64, the image's copy lives at
          # C:/msys64. Keyed on the coffer ref + msystem: a pin bump
          # rebuilds; otherwise the install is restored in seconds instead
          # of recompiled. A stale key (moved MSYS2 root) degrades to a
          # miss+rebuild, never a break.
          path: ${{ steps.coffer-prefix.outputs.path }}
          key: coffer-install-ucrt64-${{ env.COFFER_REF }}

      - name: Build & install coffer
        if: steps.coffer-cache.outputs.cache-hit != 'true'
        working-directory: coffer
        run: |
          ./autogen.sh
          mkdir build && cd build
          sh ../configure --prefix="$HOME/.local" --enable-release
          make -j"$(nproc)"
          make install

      - name: Build portty
        run: |
          # setup-msys2 does not pass PKG_CONFIG_PATH through to the
          # MSYS2 environment (msys2/setup-msys2#98), and /etc/profile
          # overwrites it on every login shell; export it here so
          # pkgconf finds the coffer.pc we just installed (from the cache
          # or the fresh build above). $HOME/.local is a POSIX path
          # (no drive letter) — a C:/... path here would split on the
          # drive-letter colon and pkg-config would see two bogus dirs.
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$PKG_CONFIG_PATH"
          ./autogen.sh
          mkdir build && cd build
          sh ../configure --enable-release
          make -j"$(nproc)"
          # Pre-build the test binaries in parallel HERE, so `make check`
          # below does not compile all 30 of them SERIALly inside the timed
          # test step. (check_PROGRAMS is a tests/ subdir target — the root
          # `make -j` above does not descend.)
          make -j"$(nproc)" -C tests check-programs

      - name: Run tests
        run: make -C build check

      - name: Build portable ZIP
        run: |
          export PKG_CONFIG_PATH="$HOME/.local/lib/pkgconfig:$PKG_CONFIG_PATH"
          make -C build dist-portable

      - name: Verify extracted portable ZIP
        run: |
          package_dir=$(mktemp -d)
          archives=(portty-*-windows-*-sdl3.zip)
          test "${#archives[@]}" -eq 1
          unzip -q "${archives[0]}" -d "$package_dir"
          stages=("$package_dir"/*/)
          test "${#stages[@]}" -eq 1
          stage="${stages[0]}"
          exe="${stage}portty.exe"
          for file in "$exe" "${stage}portty.cmd" "${stage}README-PORTABLE.txt"; do
            test -f "$file"
          done
          test -n "$(find "$stage" -maxdepth 1 -iname 'SDL3.dll' -print -quit)"

          # The launcher advertises the bundled terminfo through TERMINFO_DIRS,
          # so a bundle that lost it is incomplete even though it still launches.
          # tic names the leaf directory after the ncurses build (a wide build
          # hex-encodes it), so locate the entry rather than assume a path.
          terminfo_dir="${stage}share/terminfo"
          entry=$(find "$terminfo_dir" -type f -name portty-256color -print -quit)
          if [ -z "$entry" ]; then
            echo "ERROR: the bundle carries no portty-256color entry; it contains:" >&2
            find "$terminfo_dir" -print >&2
            exit 1
          fi
          TERMINFO_DIRS="$terminfo_dir" infocmp portty-256color >/dev/null

          # Windows resolves an executable's imports from its own directory
          # first, so a PATH holding nothing but System32 proves the bundle is
          # self-contained: whatever it does not provide has to come from Windows.
          # System32 has its own timeout.exe, so name the coreutils one outright.
          timeout_bin=$(command -v timeout)
          test -n "$timeout_bin"
          system32="$(cygpath -u "${SYSTEMROOT:-C:\\Windows}")/System32"
          if ! (cd "$stage" && PATH="$system32" "$timeout_bin" 60 "$exe" --version); then
            echo "ERROR: the packaged portty.exe did not start with only $system32 on PATH" >&2
            exit 1
          fi

          echo "PORTTY_PACKAGED_EXE=$exe" >> "$(cygpath -u "$GITHUB_ENV")"

      - name: Packaged GUI smoke test (selection drag)
        run: |
          mkdir -p build/smoke
          rm -f build/smoke/child_ran.txt build/smoke/selection.json
          cat > build/smoke/select.script <<'EOF'
          wait 2.0
          sendln echo SMOKE_MARKER_OK > build/smoke/child_ran.txt
          wait 2.5
          mousemove 20 40
          mousedown 20 40
          mousemove 200 40
          mousemove 200 60
          mouseup 200 60
          wait 0.3
          dumpstate build/smoke/selection.json
          quit
          EOF
          "$PORTTY_PACKAGED_EXE" -S build/smoke/select.script
          # The child must have run, and the drag must have reached the dump:
          # pausing the PTY for a selection must not end the session.
          grep -q SMOKE_MARKER_OK build/smoke/child_ran.txt
          test -s build/smoke/selection.json
          grep -q '"selection": {' build/smoke/selection.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: portty-windows-x86_64-sdl3
          path: portty-*-windows-*-sdl3.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}
