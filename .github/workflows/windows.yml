name: Windows

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build & Test
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout portty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout coffer (dependency)
        uses: actions/checkout@v7
        with:
          repository: chestso/coffer
          ref: v0.1.3
          path: coffer
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-toolchain
            autoconf
            automake
            libtool
            make
            pkg-config
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-thorvg
            ncurses
            zip
            p7zip

      - name: Build & install coffer
        working-directory: coffer
        run: |
          ./autogen.sh
          mkdir build && cd build
          sh ../configure --prefix="$MINGW_PREFIX"
          make -j"$(nproc)"
          make check
          make install

      - name: Build portty
        run: |
          ./autogen.sh
          mkdir build && cd build
          if [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = "true" ]; then
            sh ../configure --enable-release
          else
            sh ../configure
          fi
          make -j"$(nproc)"

      - name: Run tests
        run: make -C build check

      - name: Build portable ZIP
        run: make -C build dist-portable

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: portty-windows-x86_64
          path: portty-*-windows-*.zip
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 1 || 30 }}

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Download x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: portty-windows-x86_64
          path: artifacts/x86_64

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/x86_64/portty-*-windows-*.zip
          generate_release_notes: false
          fail_on_unmatched_files: true
