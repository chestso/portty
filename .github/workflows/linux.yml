name: GNU/Linux

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_call:

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout portty
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Checkout coffer (dependency)
        uses: actions/checkout@v7
        with:
          repository: chestso/coffer
          ref: v0.20.0
          path: coffer
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            libtool \
            make \
            pkg-config \
            libfreetype6-dev \
            libharfbuzz-dev \
            libpng-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxi-dev \
            libxcursor-dev \
            libgl-dev \
            libncurses-dev \
            libsdl3-dev \
            libthorvg-dev \
            curl

      - name: Build & install coffer
        working-directory: coffer
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install

      - name: Build portty
        run: |
          ./autogen.sh
          mkdir build && cd build
          ../configure
          make -j"$(nproc)"

      - name: Run tests
        run: make -C build check

      # The automake harness keeps the failing test's output in its own log
      # file, so a red "make check" says nothing about what went wrong — a
      # shell test that timed out reads as a bare "FAIL: test-drop.sh" with
      # no clue which wait-for the run died on.
      - name: Show test logs
        if: failure()
        run: |
          cat build/tests/test-suite.log || true
          for f in build/tests/test_*.log; do
            echo "=== $f"
            cat "$f"
          done

      # Keep the same logs as an artifact too: a long test log can push the
      # step output past what the live log view retains.
      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portty-test-logs-linux
          path: build/tests/*.log
          if-no-files-found: ignore

      - name: Create distribution tarball
        run: make -C build dist

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v7
        with:
          name: portty-source-tarball
          path: build/portty-*.tar.gz
          if-no-files-found: error
